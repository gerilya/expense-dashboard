# Onboarding: generates .agents/ for this repository and opens one pull
# request per document (gerilya/repo-agent, .github/workflows/bootstrap.yml).
# Run by hand from the Actions tab.
name: repo-agent bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    uses: gerilya/repo-agent/.github/workflows/bootstrap.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
