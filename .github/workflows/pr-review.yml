# The repo-agent PR review lane: the caller from
# gerilya/repo-agent/templates/caller-workflow.yml, for a live end-to-end test.
name: PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # This repository is public, and this event runs with its secrets for
    # fork pull requests too: review only pull requests from this repository's
    # own branches, so nobody else can spend the model budget
    # (gerilya/repo-agent#61). The variable is the kill switch.
    if: ${{ !github.event.pull_request.draft && vars.REPOAGENT_PR_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: gerilya/repo-agent/.github/workflows/pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
